<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stimlog</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<!-- ============================================================
  TEIL 1: NUR HTML/CSS — kann Python nicht ersetzen
============================================================ -->
<style>
  :root {
    --bg:      #070b14;
    --surface: #0d1321;
    --surface2:#131d30;
    --border:  rgba(120,160,255,0.1);
    --accent:  #6eaaff;
    --text:    #dce8ff;
    --muted:   #4a6080;
    --ok:      #00c9a7;
    --warn:    #ffb347;
    --danger:  #ff4f4f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px 60px;
    gap: 32px;
  }

  .logo { font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.25em; color: var(--muted); text-transform: uppercase; }

  .ring-wrap { position: relative; width: 240px; height: 240px; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-bg  { fill: none; stroke: var(--surface2); stroke-width: 12; }
  .ring-arc { fill: none; stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset .8s ease, stroke .4s; }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; pointer-events: none; }
  .ring-label { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.1em; }
  .ring-mg    { font-family: 'DM Mono', monospace; font-size: 48px; font-weight: 500; line-height: 1; transition: color .4s; }
  .ring-unit  { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
  .ring-sub   { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); margin-top: 6px; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 320px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .stat-label { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 4px; }
  .stat-val   { font-family: 'DM Mono', monospace; font-size: 22px; color: var(--text); }
  .stat-unit  { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); }

  .plus-btn { width: 60px; height: 60px; border-radius: 50%; border: none; background: var(--accent); color: #070b14; font-size: 28px; cursor: pointer; transition: transform .15s, opacity .15s; }
  .plus-btn:hover  { opacity: .85; }
  .plus-btn:active { transform: scale(.93); }

  .logs { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 6px; }
  .logs-header { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; display: flex; justify-content: space-between; margin-bottom: 2px; }
  .clear-btn { background: none; border: none; cursor: pointer; font-family: 'DM Mono', monospace; font-size: 9px; color: var(--muted); transition: color .15s; }
  .clear-btn:hover { color: var(--danger); }
  .log-row { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  .log-icon { font-size: 18px; }
  .log-name { font-size: 13px; flex: 1; }
  .log-time { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); }
  .log-mg   { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--accent); }
  .log-del  { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 13px; transition: color .15s; }
  .log-del:hover { color: var(--danger); }
  .empty { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); text-align: center; padding: 12px 0; }

  .modal-bg { position: fixed; inset: 0; background: rgba(7,11,20,.8); backdrop-filter: blur(4px); z-index: 10; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .modal-bg.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 20px 20px 0 0; padding: 24px 20px 40px; width: 100%; max-width: 400px; transform: translateY(100%); transition: transform .25s ease; }
  .modal-bg.open .modal { transform: translateY(0); }
  .modal-handle { width: 32px; height: 4px; background: var(--surface2); border-radius: 99px; margin: 0 auto 20px; }
  .modal-title  { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 14px; }
  .drink-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
  .drink-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: border-color .15s; }
  .drink-btn.sel { border-color: var(--accent); background: rgba(110,170,255,.08); }
  .drink-icon2 { font-size: 18px; }
  .drink-name2 { font-family: 'DM Mono', monospace; font-size: 8px; color: var(--muted); text-align: center; }
  .drink-mg2   { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--accent); }
  .m-field { margin-bottom: 14px; }
  .m-field label { display: block; font-family: 'DM Mono', monospace; font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 5px; }
  .m-field input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 14px; padding: 9px 11px; outline: none; transition: border-color .2s; }
  .m-field input:focus { border-color: var(--accent); }
  .confirm-btn { width: 100%; padding: 13px; background: var(--accent); color: #070b14; border: none; border-radius: 10px; font-family: 'DM Mono', monospace; font-size: 13px; cursor: pointer; transition: opacity .15s; }
  .confirm-btn:hover { opacity: .85; }
</style>
</head>
<body>

<div class="logo">Stimlog</div>

<div class="ring-wrap">
  <svg width="240" height="240" viewBox="0 0 240 240">
    <circle class="ring-bg"  cx="120" cy="120" r="100"/>
    <circle class="ring-arc" id="r-arc" cx="120" cy="120" r="100"
      stroke="var(--ok)" stroke-dasharray="628.3" stroke-dashoffset="628.3"/>
  </svg>
  <div class="ring-center">
    <div class="ring-label">Aktiv im Blut</div>
    <div class="ring-mg" id="r-mg">0</div>
    <div class="ring-unit">/ 400 mg</div>
    <div class="ring-sub" id="r-sub"></div>
  </div>
</div>

<div class="stats">
  <div class="stat">
    <div class="stat-label">Heute total</div>
    <div class="stat-val" id="s-total">0</div>
    <div class="stat-unit">mg</div>
  </div>
  <div class="stat">
    <div class="stat-label">Noch aktiv</div>
    <div class="stat-val" id="s-pct">0%</div>
    <div class="stat-unit">vom total</div>
  </div>
</div>

<button class="plus-btn" onclick="modalOeffnen()">+</button>

<div class="logs">
  <div class="logs-header">
    <span>Heute</span>
    <button class="clear-btn" onclick="alleLoeschen()">Alle löschen</button>
  </div>
  <div id="log-liste"></div>
</div>

<div class="modal-bg" id="modal-bg" onclick="hintergrundKlick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Getränk wählen</div>
    <div class="drink-grid" id="drink-grid"></div>
    <div class="m-field" id="custom-feld" style="display:none">
      <label>mg (custom)</label>
      <input type="number" id="custom-mg" placeholder="80" min="1" max="999">
    </div>
    <button class="confirm-btn" onclick="logHinzufuegen()">Tracken</button>
  </div>
</div>


<!-- ============================================================
  TEIL 2: PYTHON-ERSETZBAR
  Jede Funktion hat einen Kommentar was sie tut,
  und was das Python-Äquivalent wäre.
============================================================ -->
<script>

// ─────────────────────────────────────────────────────────────
// EINSTELLUNGEN — hier kannst du einfach Werte anpassen
// ─────────────────────────────────────────────────────────────

const TAGESLIMIT   = 400;   // maximale mg pro Tag (kannst du ändern)
const HALBWERTSZEIT = 5.5;  // Stunden bis Koffein auf 50% fällt
const RING_UMFANG  = 628.3; // Umfang des SVG-Rings (nicht ändern)

// Liste aller Getränke mit Name, Emoji und Koffein in mg
// → In Python wäre das ein Dictionary oder eine Liste
const GETRAENKE = [
  { key: 'espresso', name: 'Espresso', emoji: '☕', mg: 63  },
  { key: 'filter',   name: 'Filter',   emoji: '☕', mg: 95  },
  { key: 'cappucc',  name: 'Cappucc.', emoji: '🥛', mg: 63  },
  { key: 'energy',   name: 'Energy',   emoji: '⚡', mg: 80  },
  { key: 'matcha',   name: 'Matcha',   emoji: '🍵', mg: 35  },
  { key: 'cola',     name: 'Cola',     emoji: '🥤', mg: 34  },
  { key: 'doppel',   name: 'Doppel',   emoji: '☕', mg: 126 },
  { key: 'custom',   name: 'Custom',   emoji: '✏️', mg: 0   },
];

// Welches Getränk gerade im Modal ausgewählt ist
let ausgewaehltesGetraenk = 'espresso';


// ─────────────────────────────────────────────────────────────
// DATEN SPEICHERN & LADEN
// → In Python: pandas.read_csv() und df.to_csv()
// ─────────────────────────────────────────────────────────────

// Alle Logs aus dem Browser-Speicher laden
// Gibt eine Liste von Log-Objekten zurück, oder [] wenn nichts gespeichert
function logsLaden() {
  const gespeichert = localStorage.getItem('stimlog');
  if (gespeichert === null) return [];
  return JSON.parse(gespeichert);
}

// Die aktuelle Liste von Logs in den Browser-Speicher schreiben
function logsSpeichern(logs) {
  localStorage.setItem('stimlog', JSON.stringify(logs));
}


// ─────────────────────────────────────────────────────────────
// KOFFEIN BERECHNEN
// → In Python: eigene Funktion mit math.pow()
// ─────────────────────────────────────────────────────────────

// Gibt das heutige Datum als Text zurück, z.B. "2025-05-28"
// Wird benutzt um nur die Logs von heute zu filtern
function heuteAlsText() {
  return new Date().toISOString().slice(0, 10);
}

// Berechnet wie viel mg Koffein aktuell noch im Blut sind
// Formel: aufgenommene_mg × 0.5 ^ (stunden_her / halbwertszeit)
// → In Python: def berechne_aktiv_mg(logs)
function aktiveMgBerechnen(logs) {
  const jetzt = Date.now(); // aktuelle Zeit in Millisekunden
  const heutigeLogs = logs.filter(log => log.datum === heuteAlsText());

  let totalAktiv = 0;

  for (const log of heutigeLogs) {
    const stundenHer = (jetzt - log.zeitstempel) / 3600000; // ms → Stunden
    const nochAktiv  = log.mg * Math.pow(0.5, stundenHer / HALBWERTSZEIT);
    totalAktiv += nochAktiv;
  }

  return totalAktiv;
}

// Berechnet wann das Koffein unter 5 mg fällt (= "koffeinfrei")
// Gibt ein Date-Objekt zurück, oder null wenn schon unter 5 mg
// → In Python: def berechne_koffeinfrei(aktiv_mg)
function koffeinfreiZeitBerechnen(aktiveMg) {
  if (aktiveMg < 5) return null;

  // Formel umgestellt: t = Halbwertszeit × log2(aktiv / 5)
  const stundenBisKoffeinfrei = HALBWERTSZEIT * Math.log2(aktiveMg / 5);
  const koffeinfreiUm = new Date(Date.now() + stundenBisKoffeinfrei * 3600000);

  return koffeinfreiUm;
}


// ─────────────────────────────────────────────────────────────
// LOGS VERWALTEN (hinzufügen, löschen)
// → In Python: Flask-Routen POST /add, /delete, /clear
// ─────────────────────────────────────────────────────────────

// Einen neuen Log speichern wenn der "Tracken"-Button gedrückt wird
function logHinzufuegen() {
  // 1. Ausgewähltes Getränk aus der Liste holen
  const getraenk = GETRAENKE.find(g => g.key === ausgewaehltesGetraenk);

  // 2. mg bestimmen — bei Custom aus dem Eingabefeld lesen
  let mg = getraenk.mg;
  if (ausgewaehltesGetraenk === 'custom') {
    mg = parseInt(document.getElementById('custom-mg').value);
    if (!mg || mg < 1) {
      alert('Bitte eine gültige mg-Zahl eingeben.');
      return;
    }
  }

  // 3. Neuen Log-Eintrag erstellen
  const neuerLog = {
    id:          Date.now().toString(), // eindeutige ID (aktuelle Zeit als Text)
    name:        getraenk.name,
    emoji:       getraenk.emoji,
    mg:          mg,
    zeitstempel: Date.now(),            // aktuelle Zeit in Millisekunden
    datum:       heuteAlsText()         // z.B. "2025-05-28"
  };

  // 4. Log zur bestehenden Liste hinzufügen und speichern
  const logs = logsLaden();
  logs.unshift(neuerLog); // unshift = vorne einfügen (neueste zuerst)
  logsSpeichern(logs);

  // 5. Modal schliessen und Anzeige aktualisieren
  modalSchliessen();
  anzeigenAktualisieren();
}

// Einen einzelnen Log anhand seiner ID löschen
function logLoeschen(id) {
  const logs = logsLaden();
  const ohneGeloeschten = logs.filter(log => log.id !== id);
  logsSpeichern(ohneGeloeschten);
  anzeigenAktualisieren();
}

// Alle heutigen Logs löschen
function alleLoeschen() {
  const bestaetigt = confirm('Alle heutigen Logs löschen?');
  if (!bestaetigt) return;

  const logs = logsLaden();
  const nurAndereTag = logs.filter(log => log.datum !== heuteAlsText());
  logsSpeichern(nurAndereTag);
  anzeigenAktualisieren();
}


// ─────────────────────────────────────────────────────────────
// ANZEIGE AKTUALISIEREN
// → In Python: Jinja-Template oder st.html() mit Werten befüllen
// ─────────────────────────────────────────────────────────────

// Liest alle Daten und aktualisiert Ring, Stats und Log-Liste
function anzeigenAktualisieren() {
  const logs      = logsLaden();
  const aktiveMg  = aktiveMgBerechnen(logs);
  const heuteLogs = logs.filter(log => log.datum === heuteAlsText());
  const totalMg   = heuteLogs.reduce((summe, log) => summe + log.mg, 0);

  // Ringfarbe: grün unter 100mg, orange bis 250mg, rot darüber
  let ringfarbe;
  if      (aktiveMg < 100) ringfarbe = 'var(--ok)';
  else if (aktiveMg < 250) ringfarbe = 'var(--warn)';
  else                     ringfarbe = 'var(--danger)';

  // Ring-Bogen aktualisieren
  const fuellstand = Math.min(aktiveMg / TAGESLIMIT, 1); // 0 bis 1
  const bogenOffset = RING_UMFANG * (1 - fuellstand);    // wie viel ist leer
  const ringElement = document.getElementById('r-arc');
  ringElement.style.strokeDashoffset = bogenOffset.toFixed(1);
  ringElement.setAttribute('stroke', ringfarbe);

  // Zahl in der Ringmitte aktualisieren
  const mgAnzeige = document.getElementById('r-mg');
  mgAnzeige.textContent = Math.round(aktiveMg);
  mgAnzeige.style.color = ringfarbe;

  // Koffeinfreizeit unter dem Ring anzeigen
  const koffeinfreiUm = koffeinfreiZeitBerechnen(aktiveMg);
  const subText = document.getElementById('r-sub');
  if (koffeinfreiUm) {
    const uhrzeit = koffeinfreiUm.toLocaleTimeString('de', { hour: '2-digit', minute: '2-digit' });
    subText.textContent = 'frei ~' + uhrzeit;
  } else {
    subText.textContent = aktiveMg < 5 ? '✓ kein Koffein' : '';
  }

  // Stats aktualisieren
  document.getElementById('s-total').textContent = totalMg;
  document.getElementById('s-pct').textContent   = totalMg > 0
    ? Math.round((aktiveMg / totalMg) * 100) + '%'
    : '0%';

  // Log-Liste aktualisieren
  const listElement = document.getElementById('log-liste');
  const sortierteHeute = heuteLogs.sort((a, b) => b.zeitstempel - a.zeitstempel);

  if (sortierteHeute.length === 0) {
    listElement.innerHTML = '<div class="empty">— noch keine logs heute —</div>';
    return;
  }

  listElement.innerHTML = sortierteHeute.map(log => {
    const uhrzeit = new Date(log.zeitstempel).toLocaleTimeString('de', { hour: '2-digit', minute: '2-digit' });
    return `
      <div class="log-row">
        <span class="log-icon">${log.emoji}</span>
        <span class="log-name">${log.name}</span>
        <span class="log-time">${uhrzeit}</span>
        <span class="log-mg">${log.mg} mg</span>
        <button class="log-del" onclick="logLoeschen('${log.id}')">✕</button>
      </div>`;
  }).join('');
}


// ─────────────────────────────────────────────────────────────
// MODAL (bleibt in JS — reines UI, kein Python nötig)
// ─────────────────────────────────────────────────────────────

// Getränke-Buttons im Modal aufbauen
function drinkGridAufbauen() {
  document.getElementById('drink-grid').innerHTML = GETRAENKE.map(g => `
    <div class="drink-btn ${g.key === ausgewaehltesGetraenk ? 'sel' : ''}"
         onclick="getraenkWaehlen('${g.key}')">
      <div class="drink-icon2">${g.emoji}</div>
      <div class="drink-name2">${g.name}</div>
      <div class="drink-mg2">${g.mg || '?'} mg</div>
    </div>`).join('');
}

// Getränk auswählen und Grid neu zeichnen
function getraenkWaehlen(key) {
  ausgewaehltesGetraenk = key;
  drinkGridAufbauen();
  // Custom-Eingabefeld nur bei "custom" anzeigen
  document.getElementById('custom-feld').style.display = key === 'custom' ? 'block' : 'none';
}

// Modal öffnen
function modalOeffnen() {
  drinkGridAufbauen();
  document.getElementById('modal-bg').classList.add('open');
}

// Modal schliessen
function modalSchliessen() {
  document.getElementById('modal-bg').classList.remove('open');
}

// Klick auf den dunklen Hintergrund schliesst das Modal
function hintergrundKlick(event) {
  if (event.target === document.getElementById('modal-bg')) {
    modalSchliessen();
  }
}



anzeigenAktualisieren();                    // beim Laden einmal ausführen
setInterval(anzeigenAktualisieren, 60000);  // danach jede Minute wiederholen

</script>
</body>
</html>
